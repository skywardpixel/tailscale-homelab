# Alloy does all the collection and pushes here via remote-write
# (--web.enable-remote-write-receiver). The only thing Prometheus scrapes
# itself is its own /metrics.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    host: dalaran

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
