name: jellyfin

services:
  jellyfin:
    image: jellyfin/jellyfin:${JELLYFIN_VERSION:-10.11.11}
    container_name: Jellyfin
    restart: unless-stopped
    # Run as the host user that owns the media / migrated data (see .env).
    user: "${JELLYFIN_UID}:${JELLYFIN_GID}"
    group_add:
      - "${MEDIA_GID}"
    environment:
      # So .NET Data Protection finds its key ring under the data dir instead
      # of falling back to an ephemeral one (the container user has no
      # /etc/passwd home).
      HOME: /var/lib/jellyfin
      # Native-style paths kept verbatim inside the container so any absolute
      # path baked into the migrated database / XML stays valid.
      JELLYFIN_DATA_DIR: /var/lib/jellyfin
      JELLYFIN_CONFIG_DIR: /etc/jellyfin
      JELLYFIN_CACHE_DIR: /var/cache/jellyfin
      JELLYFIN_LOG_DIR: /var/lib/jellyfin/log
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: video,compute,utility
    volumes:
      - data:/var/lib/jellyfin
      - config:/etc/jellyfin
      - cache:/var/cache/jellyfin
      # Same path inside and out — keeps DB library paths valid.
      - ${MEDIA_DIR}:${MEDIA_DIR}:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # No published port: reached only through the caddy service below, over
    # the tailnet.

  caddy:
    build:
      context: ../_caddy-tailscale
    image: services/caddy-tailscale:local
    container_name: Jellyfin_caddy
    restart: unless-stopped
    depends_on:
      - jellyfin
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_HOSTNAME: ${TS_HOSTNAME}
      TAILNET_NAME: ${TAILNET_NAME}
      CUSTOM_DOMAIN: ${CUSTOM_DOMAIN}
      CF_API_TOKEN: ${CF_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - tailscale_state:/var/lib/tailscale-caddy

volumes:
  # Populated from the native install by ./migrate.sh; external so the
  # migration owns their lifecycle.
  data:
    external: true
    name: jellyfin_data
  config:
    external: true
    name: jellyfin_config
  cache:
    external: true
    name: jellyfin_cache
  # Fresh volumes for the Caddy/Tailscale front.
  caddy_data:
  caddy_config:
  tailscale_state:
