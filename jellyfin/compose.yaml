name: jellyfin

services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: Jellyfin
    restart: unless-stopped
    environment:
      # Persist the .NET Data Protection key ring inside the config volume
      # (the image's default $HOME isn't on a volume).
      HOME: /config
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: video,compute,utility
    volumes:
      - config:/config
      - cache:/cache
      - ${MEDIA_DIR}:/media:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - default
      - media
    # No published port: reached only through the caddy service below, over
    # the tailnet. The `media` network is internal-only, for the monitoring
    # project's media-exporter to scrape /Sessions.

  caddy:
    build:
      context: ../_caddy-tailscale
    image: services/caddy-tailscale:local
    container_name: Jellyfin_caddy
    restart: unless-stopped
    depends_on:
      - jellyfin
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_HOSTNAME: ${TS_HOSTNAME}
      TAILNET_NAME: ${TAILNET_NAME}
      CUSTOM_DOMAIN: ${CUSTOM_DOMAIN}
      CF_API_TOKEN: ${CF_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - tailscale_state:/var/lib/tailscale-caddy

  # One-shot: keeps the DNS-only A ${CUSTOM_DOMAIN} -> ${TS_IPV4}
  # in Cloudflare. Runs to completion and exits on every `up`.
  dns-sync:
    build:
      context: ../_dns-sync
    image: services/dns-sync:local
    container_name: Jellyfin_dns_sync
    restart: "no"
    environment:
      TS_IPV4: ${TS_IPV4:?set the Caddy node Tailscale IPv4 in .env}
      CUSTOM_DOMAIN: ${CUSTOM_DOMAIN}
      CF_API_TOKEN: ${CF_API_TOKEN}

networks:
  # Shared with the monitoring project so media-exporter can call the Jellyfin
  # API over the compose network. Create it once with:
  #   docker network create media
  media:
    external: true

volumes:
  config:
  cache:
  caddy_data:
  caddy_config:
  tailscale_state:
