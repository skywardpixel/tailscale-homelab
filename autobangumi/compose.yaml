name: autobangumi

services:
  autobangumi:
    image: ghcr.io/estrellaxd/auto_bangumi:latest
    container_name: AutoBangumi
    restart: unless-stopped
    environment:
      TZ: America/Los_Angeles
      PUID: "1000"
      PGID: "1000"
      UMASK: "022"
    volumes:
      - config:/app/config
      - data:/app/data
    networks:
      - default
      # Reaches the qbittorrent project's WebUI at http://qbittorrent:8080.
      - downloads
    # No published port: only reachable through the caddy service below,
    # over the tailnet.
    # Override the image's healthcheck: it uses http://localhost:7892 which
    # resolves to ::1 first, but the app only listens on IPv4, and busybox
    # wget doesn't fall back — so the stock check always reports unhealthy.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7892/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    build:
      context: ../_caddy-tailscale
    image: services/caddy-tailscale:local
    container_name: AutoBangumi_caddy
    restart: unless-stopped
    depends_on:
      - autobangumi
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_HOSTNAME: ${TS_HOSTNAME}
      TAILNET_NAME: ${TAILNET_NAME}
      CUSTOM_DOMAIN: ${CUSTOM_DOMAIN}
      CF_API_TOKEN: ${CF_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - tailscale_state:/var/lib/tailscale-caddy
    # No published ports either: Caddy binds to the tsnet (Tailscale)
    # interface, not the host network — there's nothing to publish.

networks:
  # Shared with the qbittorrent project. Create once with:
  #   docker network create --subnet 172.28.0.0/16 downloads
  downloads:
    external: true

volumes:
  # Existing volumes from the pre-compose container, reused as-is.
  config:
    external: true
    name: AutoBangumi_config
  data:
    external: true
    name: AutoBangumi_data
  # New volumes for the Caddy/Tailscale front.
  caddy_data:
  caddy_config:
  tailscale_state:
