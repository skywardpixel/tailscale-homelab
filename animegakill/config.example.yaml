# animegakill — the whole service, in one file. No web UI, no rule database.
#
# Edit, then:  docker compose restart animegakill
# Check first: docker compose run --rm animegakill feeds
#
# This file IS committed, so your feed list is version-controlled with the rest
# of the homelab. Secrets are not: ${VAR} is expanded from .env at load time.

qbittorrent:
  # The qbittorrent project, over the shared `downloads` network.
  host: http://qbittorrent:8080
  # Unused in the default setup: this container's subnet (172.28.0.0/16) is in
  # qBittorrent's WebUI auth whitelist, so no login is attempted. Set QB_PASS
  # in .env only if you remove that whitelist.
  username: admin
  password: ${QB_PASS:-}
  # Torrents land here, and the renamer ONLY ever touches this category.
  # It must not be the one AutoBangumi uses (it uses `Bangumi`), or this
  # renamer would operate on torrents another tool already manages.
  category: AnimeGaKill
  tags: [animegakill]

downloader:
  # qBittorrent mounts DOWNLOADS_DIR at the same path inside and out, so this
  # one value is correct on both sides.
  # /mnt/downloads/anime — the library root Jellyfin already scans (its
  # MEDIA_DIR is /mnt/downloads). Writing anywhere else means the episodes
  # download fine and never appear in Jellyfin.
  save_path: ${DOWNLOADS_DIR}/anime
  path_template: "{title}/Season {season_num}"
  # Which title to use when a release carries several: en | zh | jp
  prefer_language: en

renamer:
  enabled: true
  # -> "Sousou no Frieren S01E05.mkv"  (Jellyfin reads this directly)
  template: "{title} S{season}E{episode}{ext}"
  # Keeps the language marker so Jellyfin still picks the right subtitle track:
  # -> "Sousou no Frieren S01E05.sc.ass"
  subtitle_template: "{title} S{season}E{episode}{lang}{ext}"
  rename_torrent: true
  min_file_size: 1000000
  remove_bad_torrents: false

program:
  interval: 900          # seconds between RSS polls
  rename_interval: 60    # seconds between rename passes
  state_file: ${AGK_STATE:-/data/animegakill.db}
  log_level: INFO
  # On a feed's first poll, mark everything already in it as seen instead of
  # downloading the whole back catalogue. false = also take whatever the feed
  # already lists when a feed is added. Flip to true before adding a
  # long-running show you do not want the full back catalogue of.
  skip_backlog: false

# Applied to every feed, on top of each feed's own filters. Case-insensitive
# regexes matched against the raw release title.
exclude:
  - '720[pP]'     # AutoBangumi filtered this on every show
  - '\d+-\d+'     # batch releases: "01-12"
  - '\d+~\d+'
  - 合集
  - 港澳台
  - '\bBatch\b'

# ---------------------------------------------------------------------------
# Feeds. One block per show is the usual shape:
#
#   - name:    identifies it in logs; also becomes the qBittorrent tag agk-<slug>
#   - url:     Mikan "subscribe to this group's releases of this show"
#   - title:   the name used on disk — set this, do not rely on the release title
#   - season:  defaults to whatever the release title implies
#   - offset:  added to every episode number (offset: -12 turns ep 13 into S02E01)
#   - include: every pattern must match;  exclude: any match rejects
# ---------------------------------------------------------------------------
feeds:
  # One block per show. The usual shape:
  #
  #   - name:    identifies it in logs; also becomes the qBittorrent tag agk-<slug>
  #   - url:     Mikan "subscribe to this group's releases of this show"
  #   - title:   the name used on disk. Set it: it should match the folder the
  #              show already occupies under the library root, so Jellyfin does
  #              not end up with two entries for one show.
  #   - season:  defaults to whatever the release title implies
  #   - offset:  added to every episode number (offset: -12 turns ep 13 into S02E01)
  #   - include: every pattern must match;  exclude: any match rejects
  #
  # After adding a show, seed it so you do not re-download what you already
  # have:  docker compose run --rm animegakill mark-seen -f "<name>"

  - name: Sousou no Frieren
    url: https://mikanani.me/RSS/Bangumi?bangumiId=3141&subgroupid=583
    title: Sousou no Frieren
    season: 1

  # One feed carrying every show you follow on Mikan. The show name and season
  # come from each release title instead of from this block.
  # - name: Mikan subscriptions
  #   url: https://mikanani.me/RSS/MyBangumi?token=${MIKAN_TOKEN}
  #   mode: aggregated
