name: animegakill

services:
  animegakill:
    image: ghcr.io/skywardpixel/animegakill:0.1.3
    container_name: AnimeGaKill
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Etc/UTC}
      # Referenced as ${DOWNLOADS_DIR} in config.yaml, so the save path is
      # written once here and matches qBittorrent's bind mount exactly.
      DOWNLOADS_DIR: ${DOWNLOADS_DIR}
      # Only used if qBittorrent asks for credentials. Clients on the
      # `downloads` subnet are in its WebUI auth whitelist, so by default this
      # is never sent — see .env.example.
      QB_PASS: ${QB_PASS:-}
      # Feed tokens (Mikan "My Bangumi" URLs carry one) stay out of git.
      MIKAN_TOKEN: ${MIKAN_TOKEN:-}
    volumes:
      # The whole configuration: feeds, filters, naming. Edit it in this repo
      # and `docker compose restart animegakill` — no UI, no database.
      - ./config.yaml:/config/config.yaml:ro
      - data:/data
    networks:
      # Reaches the qbittorrent project's WebUI at http://qbittorrent:8080.
      - downloads
    # No caddy/dns-sync sidecar and no Caddyfile, unlike the other projects:
    # this service has no web UI to front. It is driven entirely by
    # config.yaml, and `docker compose logs` is the only thing to look at.
    healthcheck:
      # Validates config.yaml and logs in to qBittorrent.
      test: ["CMD", "animegakill", "check"]
      interval: 5m
      timeout: 30s
      start_period: 30s
      retries: 3
    # Never touches the media itself — it only calls qBittorrent's API and
    # writes one sqlite file — so it needs no download mount and no privileges.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

networks:
  # Shared with the qbittorrent project. Create it once with:
  #   docker network create --subnet 172.28.0.0/16 downloads
  downloads:
    external: true

volumes:
  # Which RSS entries have been seen and which files have been renamed.
  data:
